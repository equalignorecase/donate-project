<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#f43f5e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Glowing Heart -->
  <path d="M16 23.5 C16 23.5 8 18 8 12.5 C8 9.8 10.2 7.5 13 7.5 C14.6 7.5 16 8.4 16 9.5 C16 8.4 17.4 7.5 19 7.5 C21.8 7.5 24 9.8 24 12.5 C24 18 16 23.5 16 23.5 Z" fill="url(#heart)" filter="url(#glow)"/>

  <!-- Golden Coin Badge -->
  <circle cx="23" cy="8.5" r="3.2" fill="url(#coin)" stroke="#ffffff" stroke-width="0.8"/>
  <path d="M23 7v3M21.8 8.2h2.4" stroke="#78350f" stroke-width="0.65" stroke-linecap="round"/>
</svg>
